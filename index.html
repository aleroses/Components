<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./catalog.css" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem("catalog-theme");
          var theme =
            saved === "light" || saved === "dark"
              ? saved
              : matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
        } catch (error) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">Demos</p>
        <h1>Components</h1>
      </div>
      <div class="top-meta">
        <p class="count" id="count"></p>
        <button type="button" id="theme" class="theme">Modo oscuro</button>
      </div>
    </header>
    <nav id="groups" class="groups" aria-label="Grupos"></nav>
    <div class="workspace">
      <main id="catalog"></main>
      <aside id="preview" class="preview">
        <p id="preview-empty" class="preview-empty">
          Elige una demo para verla aquí.
        </p>
        <div id="preview-ficha" class="ficha" hidden>
          <div>
            <h2 id="preview-title"></h2>
            <p id="preview-meta"></p>
          </div>
          <a id="preview-open">Abrir en su página</a>
        </div>
        <iframe
          id="preview-frame"
          title="Vista previa de la demo"
          hidden
        ></iframe>
      </aside>
    </div>
    <script src="./catalog.js" type="module"></script>
  </body>
</html>
