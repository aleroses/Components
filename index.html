<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Components</title>
    <link rel="stylesheet" href="./catalog.css" />
  </head>
  <body>
    <header class="top">
      <div>
        <p class="eyebrow">Demos</p>
        <h1>Components</h1>
      </div>
      <p class="count" id="count"></p>
    </header>
    <nav id="groups" class="groups" aria-label="Grupos"></nav>
    <div class="workspace">
      <main id="catalog"></main>
      <aside id="preview" class="preview">
        <p id="preview-empty" class="preview-empty">
          Elige una demo para verla aquí.
        </p>
        <div id="preview-ficha" class="ficha" hidden>
          <div>
            <h2 id="preview-title"></h2>
            <p id="preview-meta"></p>
          </div>
          <a id="preview-open">Abrir en su página</a>
        </div>
        <iframe
          id="preview-frame"
          title="Vista previa de la demo"
          hidden
        ></iframe>
      </aside>
    </div>
    <script src="./catalog.js" type="module"></script>
  </body>
</html>
